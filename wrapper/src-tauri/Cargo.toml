[package]
name = "porua-wrapper"
version = "0.1.0"
description = "Porua TTS Server Wrapper"
authors = ["Porua Team"]
license = "MIT"
repository = "https://github.com/ShahadIshraq/porua"
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = [ "fs-read-dir", "shell-execute", "shell-open", "fs-exists", "fs-create-dir", "http-request", "fs-read-file", "path-all", "notification-all", "fs-copy-file", "fs-write-file", "system-tray", "notification", "dialog-save", "global-shortcut-all", "window-all", "macos-private-api"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", features = ["stream", "json"] }
futures-util = "0.3"
dirs = "5.0"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
image = "0.24"
open = "5.0"
uuid = { version = "1.0", features = ["v4"] }
chrono = "0.4"

[target."cfg(windows)".dependencies]
windows = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_System_SystemInformation"
]}

[dev-dependencies]
tempfile = "3.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri = { version = "1.5", features = ["system-tray", "notification", "shell-sidecar"] }

[target."cfg(unix)".dependencies]
libc = "0.2"
